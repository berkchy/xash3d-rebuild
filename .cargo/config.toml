[net]
git-fetch-with-cli = true

[patch.crates-io]
# maintui currently depends on the published `csz` crate, but CI can fail when
# the crates.io index does not expose that package revision. Override it with
# the upstream git repository pinned to the 0.3.1 release expected by maintui's
# current workspace and lockfile.
csz = { git = "https://github.com/FWGS/csz.git", tag = "v0.3.1" }
