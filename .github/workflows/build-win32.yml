name: Windows Builds
on:
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targetos: win32
            targetarch: amd64
          - os: windows-2022 # always use the oldest possible for 32-bit because of older compilers, and better support of certain legacy OSes
            targetos: win32
            targetarch: i386
    env:
      SDL_VERSION: 2.32.10
      FFMPEG_VERSION: 7.1
      GH_CPU_ARCH: ${{ matrix.targetarch }}
      GH_CPU_OS: ${{ matrix.targetos }}
      GH_CROSSCOMPILING: ${{ matrix.cross }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: bash scripts/gha/deps_${{ matrix.targetos }}.sh
      - name: Build engine
        env:
          FWGS_PFX_PASSWORD: ${{ secrets.FWGS_PFX_PASSWORD }}
        run: bash scripts/gha/build_${{ matrix.targetos }}.sh
      - name: Upload engine (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.targetos }}-${{ matrix.targetarch }}
          path: artifacts/*
